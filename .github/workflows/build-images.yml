name: Build Images

on:
  workflow_call:
    inputs:
      build-type:
        type: string
        required: true
      app-version:
        type: string
        required: true
      git-short-hash:
        type: string
        required: true

permissions:
  contents: 'write'
  id-token: 'write'
  packages: 'write'

jobs:
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stamps the release version into every workspace package.json. The
      # Dockerfile reads them out of the build context, so this has to happen
      # before the build, not inside it.
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          logout: false
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile installs, compiles and assembles everything itself, so
      # the job is a checkout and a build: no host toolchain, no per-app jobs,
      # no artifacts passed between them.
      - name: Build backend Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          provenance: true
          file: .github/deployment/node/Dockerfile
          # GITHUB_SHA is stamped into the frontend bundles. The bundler would
          # otherwise read it from the git repository, which .dockerignore
          # keeps out of the build context.
          build-args: |
            BUILD_TYPE=${{ inputs.build-type }}
            GITHUB_SHA=${{ github.sha }}
          tags: ghcr.io/toeverything/affine:${{ inputs.build-type }}-${{ inputs.git-short-hash }}
