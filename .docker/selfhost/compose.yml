name: affine

# The server is built from the sources in this repository — clone,
# `docker compose build`, `docker compose up`. Nothing is pulled from a
# published tag, so the running stack is always the code that is checked out
# here.
#
# There is no migration job next to the server any more. The image's entrypoint
# (packages/backend/server/scripts/self-host-entrypoint.sh) runs the initial
# setup itself — schema migrations, data migrations, standard seed — before it
# hands over to the server, on every start and on both of its paths. So the
# only thing this file still has to say is which database and which cache the
# server should use.

services:
  affine:
    image: affine:selfhost
    build:
      # The Dockerfile compiles the workspace, so the context is the repository
      # root, not this directory.
      context: ../..
      dockerfile: .github/deployment/node/Dockerfile
    container_name: affine_server
    ports:
      - '3010:3010'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./data/storage:/root/.affine/storage
      - ./config:/root/.affine/config
    environment:
      # Filled, so the entrypoint connects to the two services below and leaves
      # the database and cache inside the image alone. Emptying both — and
      # dropping the two services with them — runs the whole stack from this
      # one container instead; the entrypoint decides that, nothing here does.
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://affine@postgres:5432/affine
    restart: unless-stopped

  redis:
    image: redis
    container_name: affine_redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: affine_postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: '--data-checksums'
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'affine', '-d', 'affine']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
