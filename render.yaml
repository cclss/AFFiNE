version: '1'

projects:
  - name: affine
    environments:
      - name: production
        services:
          - type: web
            name: affine
            runtime: docker
            plan: standard
            # Built from the sources in this repository, by the same Dockerfile
            # the self-host image uses. Nothing is pulled from a published tag.
            dockerfilePath: ./.github/deployment/node/Dockerfile
            dockerContext: .
            # That image's CMD is `node ./dist/main.js`. Render needs two things
            # in front of it, and neither belongs in the image:
            #
            #   1. The hostname Render assigns, unless AFFINE_SERVER_HOST is
            #      already set to a custom domain.
            #   2. The bootstrap: generates the server private key on first
            #      boot, then runs the Prisma and data migrations. It is
            #      idempotent, so it is safe on every boot.
            dockerCommand: >-
              sh -c 'export
              AFFINE_SERVER_HOST="${AFFINE_SERVER_HOST:-${RENDER_EXTERNAL_HOSTNAME:-localhost}}"
              && node ./scripts/self-host-predeploy.js && exec node
              ./dist/main.js'
            healthCheckPath: /info
            disk:
              # Uploaded blobs (~/.affine/storage) and the generated private key
              # (~/.affine/config/private.key) must survive restarts.
              name: affine-data
              mountPath: /root/.affine
              sizeGB: 10
            envVars:
              - key: AFFINE_SERVER_PORT
                value: 10000
              - key: AFFINE_SERVER_HTTPS
                value: true
              - key: DATABASE_URL
                fromDatabase:
                  name: affine-postgres
                  property: connectionString
              - key: REDIS_SERVER_HOST
                fromService:
                  name: affine-keyvalue
                  type: keyvalue
                  property: host
              - key: REDIS_SERVER_PORT
                fromService:
                  name: affine-keyvalue
                  type: keyvalue
                  property: port

          - type: keyvalue
            name: affine-keyvalue
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList: [] # internal connections only

        databases:
          - name: affine-postgres
            plan: basic-256mb
            postgresMajorVersion: '16'
            ipAllowList: [] # internal connections only
