version: '1'

projects:
  - name: affine
    environments:
      - name: production
        services:
          - type: web
            name: affine
            runtime: docker
            plan: standard
            # Built from the sources in this repository, by the same Dockerfile
            # the self-host image uses. Nothing is pulled from a published tag.
            dockerfilePath: ./.github/deployment/node/Dockerfile
            dockerContext: .
            # No dockerCommand. The image's ENTRYPOINT
            # (packages/backend/server/scripts/self-host-entrypoint.sh) already
            # does the bootstrap — server private key on first boot, then the
            # Prisma and data migrations, idempotent on every boot — and then
            # execs the image's CMD, `node ./dist/main.js`. Render overrides
            # only CMD, never the ENTRYPOINT, so a command here could not
            # replace that startup; it could only be a second copy of it.
            healthCheckPath: /info
            disk:
              # Uploaded blobs (~/.affine/storage) and the generated private key
              # (~/.affine/config/private.key) must survive restarts.
              name: affine-data
              mountPath: /root/.affine
              sizeGB: 10
            envVars:
              # The hostname Render assigns. Render sets
              # RENDER_EXTERNAL_HOSTNAME in the container itself; this copies
              # it to the key the server actually reads, which would otherwise
              # fall back to `localhost`. Serving a custom domain instead means
              # replacing these four lines with `value: <that domain>`.
              - key: AFFINE_SERVER_HOST
                fromService:
                  name: affine
                  type: web
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: AFFINE_SERVER_PORT
                value: 10000
              - key: AFFINE_SERVER_HTTPS
                value: true
              - key: DATABASE_URL
                fromDatabase:
                  name: affine-postgres
                  property: connectionString
              - key: REDIS_SERVER_HOST
                fromService:
                  name: affine-keyvalue
                  type: keyvalue
                  property: host
              - key: REDIS_SERVER_PORT
                fromService:
                  name: affine-keyvalue
                  type: keyvalue
                  property: port

          - type: keyvalue
            name: affine-keyvalue
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList: [] # internal connections only

        databases:
          - name: affine-postgres
            plan: basic-256mb
            postgresMajorVersion: '16'
            ipAllowList: [] # internal connections only
